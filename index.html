<!doctype html><html lang=es><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel="shortcut icon" href=./public/img/favico.png type=image/x-icon><title>Validador de Expresiones Regulares</title><script defer src=bundle.js></script></head><body><div class="container mt-5"><div class="row justify-content-center"><div class="col text-center"><h1>Validador de Expresiones Regulares</h1><p>Comprueba si un texto cumple con una expresión regular.</div></div><div class="row justify-content-center mt-4"><div class=col-md-8><div class=formulario><div class=mb-4><label for=expresion class=form-label>Expresión regular:</label> <input class=form-control id=expresion placeholder="Ejemplo: ^[A-Za-z]+$"></div><div class=mb-4><label for=texto class=form-label>Texto a validar:</label> <input class=form-control id=texto placeholder="Escribe el texto que deseas validar"></div><div class="text-center mt-4"><button id=comparar class="btn btn-comparar">Comparar</button> <button id=limpiar class="btn btn-limpiar">Limpiar</button></div><div id=resultado class=mt-4></div></div></div></div></div><script src=../dist/bundle.js></script></body></html>
